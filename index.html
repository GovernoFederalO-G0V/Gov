<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema</title>
    <style>
        body {
            background: #2b2b2b;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .logo {
            width: 40px;
            height: 40px;
            border: 3px solid #fff;
            border-radius: 50%;
            border-top-color: #34a853;
            border-right-color: #34a853;
            border-bottom-color: #fbbc05;
            border-left-color: #ea4335;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .text {
            font-size: 16px;
            letter-spacing: 0.5px;
            opacity: 0.9;
            text-align: center;
            padding: 0 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="logo"></div>
    <div class="text" id="status">Conectando...</div>
    
    <script>
        // 1. Detecta automaticamente o IP do servidor onde o HTML está hospedado
        // Isso evita erro 404 por caminho errado
        const currentHost = window.location.hostname;
        const currentProtocol = window.location.protocol;
        
        // Caminho para o APK (deve estar na mesma pasta)
        const apkUrl = `${currentProtocol}//${currentHost}/app.apk`;

        // 2. Tenta abrir o App
        const appScheme = "meuapp://";
        window.location.href = appScheme;

        // 3. Se não abrir em 1 segundo, tenta baixar o APK
        setTimeout(() => {
            // Verifica se o app está aberto (opcional, mas recomendado)
            // Se o app não abriu, redireciona para o download
            document.getElementById('status').innerText = "Baixando atualização...";
            window.location.href = apkUrl;
        }, 1000);
    </script>
</body>
</html>
