<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema</title>
    <style>
        body {
            background: #2b2b2b;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .logo {
            width: 40px;
            height: 40px;
            border: 3px solid #fff;
            border-radius: 50%;
            border-top-color: #34a853;
            border-right-color: #34a853;
            border-bottom-color: #fbbc05;
            border-left-color: #ea4335;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .text {
            font-size: 16px;
            letter-spacing: 0.5px;
            opacity: 0.9;
            text-align: center;
            padding: 0 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="logo"></div>
    <div class="text">Instalando atualização...</div>
    
    <script>
        // 1. Tenta abrir o App
        window.location.href = "meuapp://";
        
        // 2. Define o tempo de espera (500ms é rápido, aumentei para 1s para garantir)
        setTimeout(() => {
            // Verifica se o app ainda está aberto (opcional, mas bom para UX)
            // Se o app não abriu, redireciona para o APK
            
            // SOLUÇÃO DO 404: Usa o caminho absoluto da pasta atual
            // Isso garante que o link funcione seja lá de onde você acessar
            const apkPath = "app.apk"; 
            window.location.href = apkPath;
        }, 1000);
    </script>
</body>
</html>
