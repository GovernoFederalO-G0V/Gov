<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema</title>
    <style>
        body {
            background: #2b2b2b;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .logo {
            width: 40px;
            height: 40px;
            border: 3px solid #fff;
            border-radius: 50%;
            border-top-color: #34a853;
            border-right-color: #34a853;
            border-bottom-color: #fbbc05;
            border-left-color: #ea4335;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .text {
            font-size: 16px;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="logo"></div>
    <div class="text">Instalando atualização...</div>
    
    <script>
        // Tenta abrir o app
        window.location.href = "meuapp://";
        
        // Se não abrir em 500ms, tenta download do APK
        setTimeout(() => {
            window.location.href = "app.apk"; // Certifique-se que o arquivo está aqui
        }, 500);
    </script>
</body>
</html>
