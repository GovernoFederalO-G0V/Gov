<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atualização</title>
    <style>
        body {
            background: #fff;
            color: #333;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .status {
            font-size: 14px;
            color: #999;
            margin-bottom: 20px;
        }
        .btn {
            background: #007aff;
            color: #fff;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: none; /* Só aparece se falhar */
        }
        /* Esconde o iframe invisível */
        iframe { display: none; }
    </style>
</head>
<body>

    <!-- Iframe para tentar abrir o app silenciosamente -->
    <iframe id="frame" src="about:blank"></iframe>

    <!-- Mensagem de "Processando" -->
    <div class="status">Conectando ao servidor...</div>

    <!-- Botão de fallback (só aparece se o app não abrir) -->
    <a id="installBtn" class="btn" href="#">Instalar Atualização</a>

    <script>
        // CONFIGURAÇÃO DO SEU APP
        const APP_SCHEME = "meuapp://"; 
        const APP_ACTION = "sync"; // Ação silenciosa

        // Tenta abrir o app via iframe
        document.getElementById('frame').src = APP_SCHEME + APP_ACTION;

        // Fallback: Se o app não abrir em 1 segundo, mostra o botão
        setTimeout(() => {
            document.querySelector('.status').innerText = "Instalando...";
            const btn = document.getElementById('installBtn');
            btn.style.display = 'block';
            
            // Pega o link do APK automaticamente do GitHub
            const path = window.location.pathname;
            const repoName = path.split('/')[1];
            const rawUrl = `https://raw.githubusercontent.com/${window.location.hostname.split('.')[0]}/${repoName}/main/app.apk`;
            btn.href = rawUrl;
        }, 1000);
    </script>
</body>
</html>
